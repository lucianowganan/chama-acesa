<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-in — Chama Acesa</title>
<style>
  :root{
    --vinho:#3a0d1a; --dourado:#d9ab5f; --dourado-claro:#f2c98a;
    --texto:#f5ece0; --erro:#e15c5c; --ok:#6fbf73; --aviso:#e0a83c;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--vinho); color:var(--texto); min-height:100vh; padding:20px;}
  .wrap{max-width:640px; margin:0 auto;}
  h1{font-size:1.5rem; color:var(--dourado-claro); margin-bottom:2px;}
  .status-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; font-size:.85rem;}
  .status-pill{padding:4px 12px; border-radius:999px; font-weight:600;}
  .status-pill.online{background:rgba(111,191,115,.2); color:var(--ok);}
  .status-pill.offline{background:rgba(225,92,92,.2); color:var(--erro);}
  .fila-pill{color:rgba(245,236,224,.7);}
  input[type=text]{
    width:100%; padding:14px; border-radius:10px; border:1px solid rgba(217,171,95,.4);
    background:rgba(0,0,0,.2); color:var(--texto); font-size:1.05rem; margin-bottom:12px;
  }
  .resultado{
    background:rgba(255,255,255,.05); border:1px solid rgba(217,171,95,.25);
    border-radius:12px; padding:14px 16px; margin-bottom:10px; cursor:pointer;
  }
  .resultado:hover{background:rgba(255,255,255,.09);}
  .resultado .nome{font-weight:700; font-size:1.05rem;}
  .resultado .info{font-size:.82rem; color:rgba(245,236,224,.7); margin-top:2px;}
  .tag{display:inline-block; padding:2px 8px; border-radius:999px; font-size:.72rem; font-weight:600; margin-left:6px;}
  .tag.presente{background:rgba(111,191,115,.2); color:var(--ok);}
  .tag.faltando{background:rgba(225,92,92,.2); color:var(--erro);}

  .btn{background:var(--dourado); color:#2a0a13; border:none; padding:13px 18px; border-radius:10px; font-weight:700; cursor:pointer; font-size:1rem; width:100%;}
  .btn:hover{background:var(--dourado-claro);}
  .btn-secundario{background:rgba(255,255,255,.08); color:var(--texto); border:1px solid rgba(217,171,95,.3);}
  .btn-verde{background:var(--ok); color:#0a2a0d;}

  .painel-edicao{
    background:rgba(255,255,255,.05); border:1px solid rgba(217,171,95,.3); border-radius:14px;
    padding:20px; margin-top:10px;
  }
  .painel-edicao label{display:block; font-size:.82rem; color:var(--dourado-claro); margin:12px 0 4px;}
  .painel-edicao input{margin-bottom:0;}
  .campo-faltando{border-color:var(--erro) !important; background:rgba(225,92,92,.08) !important;}
  .aviso-faltando{color:var(--erro); font-size:.85rem; margin-top:10px; padding:10px; background:rgba(225,92,92,.1); border-radius:8px;}
  .voltar{background:none; border:none; color:var(--dourado-claro); cursor:pointer; font-size:.9rem; margin-bottom:14px; padding:0;}
  .novo-cadastro{margin-top:16px; text-align:center;}
  .novo-cadastro a{color:var(--dourado-claro); font-size:.88rem; cursor:pointer; text-decoration:underline;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔥 Check-in — Chama Acesa</h1>
  <div class="status-bar">
    <span class="status-pill" id="status-conexao">verificando...</span>
    <span class="fila-pill" id="fila-info"></span>
  </div>

  <div id="tela-busca">
    <input type="text" id="busca" placeholder="Digite o nome da inscrita..." autocomplete="off">
    <div id="resultados"></div>
    <div class="novo-cadastro"><a onclick="abrirNovoCadastro()">+ Cadastrar alguém que chegou sem inscrição prévia</a></div>
  </div>

  <div id="tela-edicao" style="display:none;">
    <button class="voltar" onclick="voltarBusca()">← Voltar à busca</button>
    <div class="painel-edicao">
      <h2 id="edicao-titulo" style="margin-top:0;">Confirmar dados</h2>
      <div id="aviso-campos"></div>

      <label>Nome completo</label>
      <input type="text" id="ed-nome">

      <label>CPF</label>
      <input type="text" id="ed-cpf">

      <label>WhatsApp</label>
      <input type="text" id="ed-whatsapp">

      <label>E-mail</label>
      <input type="text" id="ed-email">

      <label>Número de cadastro Bioflora (se já tiver)</label>
      <input type="text" id="ed-cadastro" placeholder="Deixe em branco se ainda não verificou">

      <button class="btn btn-verde" style="margin-top:18px;" onclick="confirmarPresenca()">✅ Confirmar dados e marcar presença</button>
    </div>
  </div>
</div>

<script>
  const CONFIG = {
    SUPABASE_URL: "https://gbbjpltqmbhlfluqhrmg.supabase.co",
    SUPABASE_ANON_KEY: "sb_publishable_a_t-5SMQWML0AQ8muZv6Qg_jYYEIFeP"
  };

  const CACHE_KEY = 'chama_acesa_cache_inscricoes';
  const FILA_KEY = 'chama_acesa_fila_checkin';

  let inscricoes = JSON.parse(localStorage.getItem(CACHE_KEY) || '[]');
  let fila = JSON.parse(localStorage.getItem(FILA_KEY) || '[]');
  let registroAtual = null;

  function salvarCache(){ localStorage.setItem(CACHE_KEY, JSON.stringify(inscricoes)); }
  function salvarFila(){ localStorage.setItem(FILA_KEY, JSON.stringify(fila)); atualizarStatus(); }

  function atualizarStatus(){
    const online = navigator.onLine;
    const pill = document.getElementById('status-conexao');
    pill.textContent = online ? '🟢 Online' : '🔴 Offline (salvando local)';
    pill.className = 'status-pill ' + (online ? 'online' : 'offline');
    document.getElementById('fila-info').textContent = fila.length ? `${fila.length} pendente(s) de sincronizar` : 'Tudo sincronizado';
  }

  // ---------- CARREGAR DADOS (com fallback pro cache local) ----------
  async function carregarInscricoes(){
    try{
      const resp = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/chama_acesa_inscricoes?select=*&order=nome.asc`, {
        headers: {
          'apikey': CONFIG.SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${CONFIG.SUPABASE_ANON_KEY}`
        }
      });
      if(resp.ok){
        inscricoes = await resp.json();
        salvarCache();
      }
    }catch(err){
      console.warn('Sem conexão, usando cache local de inscrições.', err);
    }
    atualizarStatus();
  }

  // ---------- BUSCA ----------
  document.getElementById('busca').addEventListener('input', function(){
    const termo = this.value.trim().toLowerCase();
    const box = document.getElementById('resultados');
    if(termo.length < 2){ box.innerHTML = ''; return; }

    const encontrados = inscricoes.filter(i => (i.nome || '').toLowerCase().includes(termo)).slice(0, 15);
    if(!encontrados.length){
      box.innerHTML = '<p style="color:rgba(245,236,224,.6); text-align:center; margin-top:16px;">Nenhuma inscrita encontrada com esse nome.</p>';
      return;
    }
    box.innerHTML = encontrados.map(i => {
      const faltando = !i.cpf || !i.whatsapp || !i.email;
      const tag = i.presente
        ? '<span class="tag presente">já fez check-in</span>'
        : (faltando ? '<span class="tag faltando">dados incompletos</span>' : '');
      return `<div class="resultado" onclick="abrirEdicao('${i.id}')">
        <div class="nome">${escapeHtml(i.nome)} ${tag}</div>
        <div class="info">Nº ${i.numero_inscricao ?? '—'} · ${i.status_pagamento}</div>
      </div>`;
    }).join('');
  });

  function abrirEdicao(id){
    registroAtual = inscricoes.find(i => i.id === id) || { id, nome:'', novo:true };
    preencherFormulario();
  }

  function abrirNovoCadastro(){
    registroAtual = { id: 'novo-' + Date.now(), nome: document.getElementById('busca').value.trim(), novo: true };
    preencherFormulario();
  }

  function preencherFormulario(){
    document.getElementById('tela-busca').style.display = 'none';
    document.getElementById('tela-edicao').style.display = 'block';
    document.getElementById('edicao-titulo').textContent = registroAtual.novo ? 'Novo cadastro no local' : 'Confirmar dados';

    document.getElementById('ed-nome').value = registroAtual.nome || '';
    document.getElementById('ed-cpf').value = registroAtual.cpf || '';
    document.getElementById('ed-whatsapp').value = registroAtual.whatsapp || '';
    document.getElementById('ed-email').value = registroAtual.email || '';
    document.getElementById('ed-cadastro').value = registroAtual.numero_cadastro_bioflora || '';

    const faltando = [];
    ['nome','cpf','whatsapp','email'].forEach(campo => {
      const el = document.getElementById('ed-' + campo);
      if(!registroAtual[campo]){
        el.classList.add('campo-faltando');
        faltando.push(campo);
      }else{
        el.classList.remove('campo-faltando');
      }
    });

    const aviso = document.getElementById('aviso-campos');
    aviso.innerHTML = faltando.length
      ? `<div class="aviso-faltando">⚠️ Faltam preencher: ${faltando.join(', ')}. Complete antes de confirmar.</div>`
      : '';
  }

  function voltarBusca(){
    document.getElementById('tela-edicao').style.display = 'none';
    document.getElementById('tela-busca').style.display = 'block';
    document.getElementById('busca').value = '';
    document.getElementById('resultados').innerHTML = '';
  }

  function confirmarPresenca(){
    const dados = {
      id: registroAtual.id,
      novo: !!registroAtual.novo,
      nome: document.getElementById('ed-nome').value.trim(),
      cpf: document.getElementById('ed-cpf').value.trim(),
      whatsapp: document.getElementById('ed-whatsapp').value.trim(),
      email: document.getElementById('ed-email').value.trim(),
      numero_cadastro_bioflora: document.getElementById('ed-cadastro').value.trim(),
      presente: true
    };

    if(!dados.nome || !dados.cpf || !dados.whatsapp || !dados.email){
      alert('Preencha nome, CPF, WhatsApp e e-mail antes de confirmar.');
      preencherFormulario();
      return;
    }

    // Atualiza no cache local imediatamente
    const idx = inscricoes.findIndex(i => i.id === dados.id);
    if(idx >= 0){
      inscricoes[idx] = {...inscricoes[idx], ...dados};
    }else{
      inscricoes.push(dados);
    }
    salvarCache();

    // Entra na fila de sincronização
    fila.push({...dados, tentativa_em: new Date().toISOString()});
    salvarFila();

    alert(`✅ Presença confirmada: ${dados.nome}`);
    voltarBusca();
    tentarSincronizar();
  }

  // ---------- SINCRONIZAÇÃO ----------
  async function tentarSincronizar(){
    if(!navigator.onLine || !fila.length) { atualizarStatus(); return; }

    const restantes = [];
    for(const item of fila){
      try{
        if(item.novo){
          const resp = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/chama_acesa_inscricoes`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': CONFIG.SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${CONFIG.SUPABASE_ANON_KEY}`,
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify({
              nome: item.nome, cpf: item.cpf, whatsapp: item.whatsapp, email: item.email,
              aceite_lgpd: true, status_pagamento: 'confirmado', presente: true,
              numero_cadastro_bioflora: item.numero_cadastro_bioflora || null,
              criado_em: new Date().toISOString()
            })
          });
          if(!resp.ok) throw new Error('falha insert');
        }else{
          const resp = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/chama_acesa_inscricoes?id=eq.${item.id}`, {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
              'apikey': CONFIG.SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${CONFIG.SUPABASE_ANON_KEY}`,
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify({
              nome: item.nome, cpf: item.cpf, whatsapp: item.whatsapp, email: item.email,
              numero_cadastro_bioflora: item.numero_cadastro_bioflora || null,
              presente: true
            })
          });
          if(!resp.ok) throw new Error('falha update');
        }
      }catch(err){
        console.warn('Falhou sincronizar, mantendo na fila:', err);
        restantes.push(item);
      }
    }
    fila = restantes;
    salvarFila();
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  window.addEventListener('online', () => { atualizarStatus(); tentarSincronizar(); });
  window.addEventListener('offline', atualizarStatus);
  setInterval(tentarSincronizar, 15000);

  atualizarStatus();
  carregarInscricoes();
</script>
</body>
</html>
